<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Example</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        header {
            background: purple;
            height: 100px;
        }

        h1 {
            text-align: center;
            color: white;
            line-height: 100px;
            margin: 0;
        }

        section {
            display: flex;
        }

        article {
            padding: 10px;
            margin: 10px;
            background: aqua;

            /* la siguiente prpiedad es para que cada articulo tome una
            misma porcion del espacio disponible */
            flex: 1 100px;

        }

        /* El selector siguiente, selecciona todos los articulos 3 que esten
        contenidos en un contenedor padre, y la propiedad flex: 2 es para que tome 2 porciones del espacio disponible. 
        
        Para entender este selector se puede ver en W3Schools en CCS Selector Tester
        https://www.w3schools.com/cssref/trysel.php */
        article:nth-of-type(3) {
            flex: 2 100px;
        }
    </style>
</head>
<body>
    <!-- Flex Box: Es una tecnica de diseño uni dimensional, para agrupar los elementos HTML en filas y columnas. Los elementos flexibles (flex items) expanden para rellenar el espacio adicional o se contraen para encajar en espacios mas pequeños  -->
    
    <!-- ¿Por que flexbox? El layout css flexbox nos permite lo siguiente:
     
    1- Verticalmente centrar un bloque de contenido dentro de su padre
    2- Hace que todos los hijos de un elemento contenedor tomen una cantidad de espacio igual del espacio disponible en ancho y altura, independientemente de cuanto ancho y altura quede
    3- Hace que todas las columnas de un diseño de multiples columnas adopte la misma altura aunque cada tengan contenidos diferentes -->

    <header>
        <h1>Flexbox ejemplo</h1>
    </header>
    <section>
        <article>
            <h2>Primer Articulo</h2>
            <p>Content ...</p>
        </article>
        <article>
            <h2>Segundo Articulo</h2>
            <p>Content ...</p>
        </article>
        <article>
            <h2>Tercer Articulo</h2>
            <p>Content ...</p>
        </article>
    </section>
</body>
</html>
