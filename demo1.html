<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex flexbox example</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        article {
            padding: 10px;
            margin: 10px;
            background: aqua;
        }

        /* Primero: hacemos que todos lo hijos del elemento section
        sean cajas flexibles */
        section {
            display: flex;
        }

        /* Segundo: A continuacion establecemos algunos valores flex
        para los propios articulos */
        article {
            flex: 1 100px;
        }

        /* La regla de estilo que establecemos a continuacion establece 
        que el tercer articulo convierta a sus hijos en elementos 
        flexibles tambien, pero esta vez distribuidos en columna */
        article:nth-of-type(3) {
            flex: 3 100px;
            display: flex;
            flex-flow: column;
        }

        /* A continuacion: Seleccionamos el primer div y lo convertimos en un 
        contenedor flexible, primero utilizamos la propiedad flex: 1 100px; 
        para asignarles a cada uno de los hijos, una altura minima efectiva de 100px. 
        Los hijos son los botones. 
        Luego hacemos que los hijos se ubiquen en una wrapping row mediante 
        flex-flow: row wrap
        Para que se alinien al centro del espacio disponible:
        align-items: center;
        justify-content: space-around; */
        article:nth-of-type(3) div:first-child {
            flex: 1 100px;
            display: flex;
            flex-flow: row wrap;
            align-items: center;
            justify-content: space-around;
        }

        /* Finalmente: Establecemos un dimensionamiento para los botones, esta vez asignandoles la regla flex: 1 auto. Esta propiedad tiene un efecto muy interesante, el cual se puede apreciar cambiando el tamaño de la ventana del navegador. Veremos que los botones tomaran tanto espacio como puedan, algunos se mantendran en una linea y los que no puedan pasaran a la linea siguiente */
        button {
            flex: 1 auto;
            margin: 5px;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <section>
        <article>
            <h2>First article</h2>
            <p>Content ...</p>
        </article>
        <article>
            <h2>Second article</h2>
            <p>Content ..</p>
        </article>
        <article>
            <div>
                <button>Smile</button>
                <button>Laugh</button>
                <button>Wink</button>
                <button>Shrug</button>
                <button>Blush</button>
            </div>
            <div>
                <p>Paragraph one content ...</p>
            </div>
            <div>
                <p>Paragraph two content ...</p>
            </div>
        </article>
    </section>
</body>

</html>
