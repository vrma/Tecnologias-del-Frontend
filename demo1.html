<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>
    <style>
        body {
            font-family: sans-serif;
        }

        .container > div {
            border-radius: 5px;
            padding: 10px;
            background-color: rgb(207 232 220);
            border: 2px solid rgb(79 185 227);
        }

        /* Creando grid flexibles utilizando unidades fr, es decir,
        indicando cuantas fracciones del espacio disponible se requiere para cada columna. Por ejemplo a continuacion queremos que cada columna tome una fraccion del espacio disponible */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
    </style>
</head>

<body>
    <div class="container">
        <div>One</div>
        <div>Two</div>
        <div>Three</div>
        <div>Four</div>
        <div>Five</div>
        <div>Six</div>
        <div>Seven</div>
    </div>
</body>

</html>
