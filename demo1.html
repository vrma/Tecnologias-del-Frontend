<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Example</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        article {
            padding: 10px;
            margin: 10px;
            background: aqua;
        }
    </style>
</head>

<body>
    <section>
        <article>
            <h2>First article</h2>
            <p>Content ...</p>
        </article>
        <article>
            <h2>Second article</h2>
            <p>Content ..</p>
        </article>
        <article>
            <div>
                <button>Smile</button>
            </div>
            <div>
                <button>Laugh</button>
            </div>
            <div>
                <button>Wink</button>
                <button>Shrug</button>
                <button>Blush</button>
            </div>
        </article>
    </section>
</body>

</html>
